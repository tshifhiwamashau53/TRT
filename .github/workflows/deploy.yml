name: Auto Create & Deploy Website

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Refresh official TRT information snapshot
        run: |
          mkdir -p data
          python - <<'PY'
          import json, re
          from datetime import datetime, timezone
          from urllib.request import Request, urlopen
          url='https://tshwanetransit.co.za/'
          try:
              req=Request(url,headers={'User-Agent':'TRT-Passenger-Information/1.0'})
              html=urlopen(req,timeout=20).read().decode('utf-8','ignore')
              text=re.sub(r'<script[\s\S]*?</script>',' ',html,flags=re.I)
              text=re.sub(r'<style[\s\S]*?</style>',' ',text,flags=re.I)
              text=re.sub(r'<[^>]+>',' ',text)
              text=re.sub(r'\s+',' ',text).strip()
              lower=text.lower()
              notices=[]
              if 'suspension of areyeng bus operations in mamelodi' in lower or ('suspended' in lower and 'mamelodi' in lower):
                  notices.append({'level':'major','title':'Mamelodi Areyeng service notice','message':'The official TRT website currently reports that Areyeng bus operations in Mamelodi are suspended until further notice.'})
              data={'source':url,'checked_at':datetime.now(timezone.utc).isoformat(),'source_status':'reachable','notices':notices}
          except Exception as exc:
              data={'source':url,'checked_at':datetime.now(timezone.utc).isoformat(),'source_status':'unavailable','notices':[],'error':str(exc)[:180]}
          open('data/live-status.json','w').write(json.dumps(data,indent=2))
          PY

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
